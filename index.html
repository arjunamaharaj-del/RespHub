<style>
  :root{
    color-scheme:light;
    --bg:#f5f5f7; --surface:#ffffff; --fill:#f5f5f7;
    --text:#1d1d1f; --text-2:#6e6e73; --text-3:#3a3a3c; --muted:#86868b; --faint:#a0a0a8; --faint-2:#b0b0b8;

    --nav-bg:rgba(245,245,247,0.82); --seg-active:#ffffff;
    --grey-btn:#f0f0f2; --grey-btn-hover:#e5e5ea; --icon-faint:#c7c7cc;
    --toast-bg:#1d1d1f; --toast-fg:#ffffff;
    --scrim:rgba(0,0,23,0.45); --hover-soft:rgba(0,0,0,0.04);
    --sel-bg:#cce4ff; --sel-fg:#0a3d7a;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --bg:#161618; --surface:#1f1f22; --fill:#2a2a2e;
    --text:#f5f5f7; --text-2:#a8a8ae; --text-3:#cfcfd4; --muted:#8a8a90; --faint:#7e7e85; --faint-2:#6e6e75;

    --grey-btn:#2a2a2e; --grey-btn-hover:#3a3a40; --icon-faint:#5a5a60;
    --toast-bg:#f5f5f7; --toast-fg:#1d1d1f;
    --scrim:rgba(0,0,0,0.6); --hover-soft:rgba(255,255,255,0.06);
    --sel-bg:#0a3d7a; --sel-fg:#cce4ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{background:var(--bg);}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background-color .25s ease,color .25s ease;}
  ::placeholder{color:var(--muted);opacity:1;}
  ::selection{background:var(--sel-bg);color:var(--sel-fg);}
  @keyframes rhRise{from{transform:translateY(10px);}to{transform:none;}}
  @keyframes rhSlideT{from{transform:translateY(-8px);}to{transform:none;}}
  @keyframes rhToast{from{opacity:0;transform:translate(-50%,16px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes rhPop{from{opacity:0;transform:translateY(10px) scale(0.97);}to{opacity:1;transform:none;}}
  @keyframes rhGlow{0%,100%{box-shadow:0 0 3px 0 var(--dot);}50%{box-shadow:0 0 11px 3px var(--dot);}}

  /* Dynamic-color hovers via CSS custom props (replaces the prototype's style-hover) */
  .rh-cardwrap{position:relative;transition:transform .18s ease;}
  .rh-cardwrap:hover{transform:translateY(-3px);}
  .rh-cardwrap:hover .rh-card{box-shadow:0 10px 26px var(--glow);border-color:var(--bc);}
  .rh-card{transition:box-shadow .18s ease,border-color .18s ease;}
  .rh-actions{position:absolute;display:flex;align-items:center;gap:2px;}
  .rh-year{font-size:10px;font-weight:600;color:var(--faint);background:var(--fill);border-radius:5px;padding:2px 6px;margin-right:2px;}
  .rh-iconbtn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:none;background:transparent;cursor:pointer;border-radius:7px;padding:0;color:var(--icon-faint);transition:color .15s ease,background .15s ease;}
  .rh-copy:hover{color:#0071e3;background:rgba(0,113,227,0.1);}
  .rh-star:hover{color:#f5a623;background:rgba(245,166,35,0.14);}
  .rh-star.on{color:#f5a623;}
  .rh-sharebtn{transition:background .15s ease;}
  .rh-sharebtn:hover{background:rgba(0,113,227,0.16);}
  .rh-suggest{transition:background .15s ease,transform .15s ease;}
  .rh-suggest:hover{background:var(--hbg) !important;transform:translateX(2px);}
  @keyframes rhStar{0%{transform:scale(.5);}60%{transform:scale(1.25);}100%{transform:scale(1);}}
  :focus-visible{outline:2px solid #0071e3;outline-offset:2px;border-radius:7px;}
  .rh-topic{transition:background .15s ease,color .15s ease,box-shadow .15s ease,transform .15s ease;}
  .rh-topic:hover{background:var(--hbg);transform:translateX(2px);}
  .rh-arow{transition:background .15s ease;}
  .rh-arow:hover{background:var(--hbg);}
  .rh-help{transition:color .15s ease,border-color .15s ease;}
  .rh-help:hover{color:#0071e3;border-color:#0071e3;}
  .rh-blue{transition:background .15s ease;}
  .rh-blue:hover{background:#0061c3;}
  .rh-lift{transition:transform .12s ease,box-shadow .15s ease;}
  .rh-lift:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,113,227,0.3);}
  .rh-grey{transition:background .15s ease;}
  .rh-grey:hover{background:var(--grey-btn-hover);}
  .rh-xbtn{transition:color .15s ease,background .15s ease;}
  .rh-xbtn:hover{color:#ff3b30;background:rgba(255,59,48,0.1);}
  .rh-iconedit{transition:background .15s ease,color .15s ease;}
  .rh-iconedit:hover{background:rgba(0,113,227,0.1);color:#0071e3;}
  .rh-icondel{transition:background .15s ease,color .15s ease;}
  .rh-icondel:hover{background:rgba(255,59,48,0.1);color:#ff3b30;}
  .rh-renamebtn{transition:background .15s ease;}
  .rh-renamebtn:hover{background:rgba(0,113,227,0.16);}

  .rh-input{transition:border-color .15s ease;}
  .rh-input:focus{border-color:#0071e3;}
  .rh-search{transition:border-color .15s ease,box-shadow .15s ease;}
  .rh-search:focus{border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,0.15);}
  .rh-input-red:focus{border-color:#ff3b30;}
  .rh-rename{transition:border-color .15s ease;}
  .rh-rename:focus{border-bottom-color:var(--fc);}

  /* Responsive: stack the two-column layouts and tighten spacing on phones */
  @media (max-width:760px){
    .rh-main{padding:30px 16px 64px !important;}
    .rh-nav{padding:0 16px !important;}
    .rh-cols{flex-direction:column !important;gap:24px !important;}
    .rh-side{position:static !important;flex:0 0 auto !important;width:100% !important;top:auto !important;}

  }
  @media (max-width:430px){
    .rh-word{display:none !important;}
  }
  @media print{
    [data-print-hide]{display:none !important;}

  }
  @media (prefers-reduced-motion: reduce){
    .rh-anim,[data-reveal]{opacity:1 !important;animation:none !important;transform:none !important;}
    [data-glow]{animation:none !important;}
  }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function safeUrl(u){ u=String(u||'').trim(); if(!u||u==='#') return '#'; if(/^https?:\/\//i.test(u)||/^mailto:/i.test(u)) return u; return '#'; }

function addSub(){

  commit(nd, extra); flash('Deleted '+name);
}

    var steps=[['rgba(0,113,227,0.12)','#0071e3','Pick a subspecialty on the left to see its landmark trials, reviews, and guidelines.'],['rgba(124,92,219,0.14)','#7c5cdb','Every card links to the source. Click it to open the paper in a new tab.'],['rgba(52,168,117,0.14)','#34a875','Press Cmd K or Ctrl K at any time to search every record at once.'],['rgba(234,88,12,0.12)','#ea580c','Open the Admin tab to add or update articles. Your changes save on this device.']];
    html+='<div data-print-hide data-act="closeHelp" style="position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:rhPop .2s ease both;"><div data-act="stop" style="width:100%;max-width:444px;background:var(--surface);border-radius:20px;padding:30px;box-shadow:0 24px 60px rgba(0,0,0,0.3);animation:rhPop .3s ease both;"><div style="display:flex;align-items:center;gap:11px;margin-bottom:6px;"><div style="width:32px;height:32px;border-radius:9px;background:#0071e3;display:flex;align-items:center;justify-content:center;flex:none;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></div><h2 style="font-size:20px;font-weight:700;color:var(--text);margin:0;letter-spacing:-0.01em;">Welcome to Respirology Hub</h2></div><p style="font-size:14px;color:var(--text-2);margin:0 0 22px;">Your quick guide to finding the evidence you need.</p><div style="display:flex;flex-direction:column;gap:15px;margin-bottom:26px;">';
    steps.forEach(function(st, i){ html+='<div style="display:flex;align-items:flex-start;gap:13px;"><span style="width:24px;height:24px;border-radius:50%;flex:none;background:'+st[0]+';color:'+st[1]+';font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">'+(i+1)+'</span><p style="font-size:14px;line-height:1.5;color:var(--text-3);margin:0;">'+st[2]+'</p></div>'; });
    html+='</div><button class="rh-blue" data-act="closeHelp" style="width:100%;font-family:inherit;font-size:14px;font-weight:600;border:none;cursor:pointer;border-radius:11px;padding:13px;background:#0071e3;color:#fff;">Got it</button><p style="text-align:center;font-size:12px;color:var(--faint);margin:14px 0 0;">Tap the ? in the top bar to see this again.</p></div></div>';
  }

  /* password modal */
  if(state.askPassword){
    html+='<div data-print-hide data-act="cancelPw" style="position:fixed;inset:0;z-index:220;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:rhPop .2s ease both;"><div data-act="stop" style="width:100%;max-width:400px;background:var(--surface);border-radius:20px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,0.3);animation:rhPop .3s ease both;"><div style="display:flex;align-items:center;gap:11px;margin-bottom:14px;"><div style="width:32px;height:32px;border-radius:9px;background:rgba(0,113,227,0.1);display:flex;align-items:center;justify-content:center;flex:none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0071e3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div><h2 style="font-size:18px;font-weight:700;color:var(--text);margin:0;letter-spacing:-0.01em;">Admin access</h2></div><p style="font-size:14px;line-height:1.5;color:var(--text-2);margin:0 0 18px;">Enter the admin password to manage the archive.</p><input id="pwInput" data-model="pwInput" data-enter="submitPw" type="password" value="'+esc(state.pwInput)+'" placeholder="Password" class="rh-input" style="width:100%;height:42px;padding:0 14px;font-family:inherit;font-size:14px;color:var(--text);background:var(--fill);border:1px solid '+(state.pwError?'#ff3b30':'var(--border-3)')+';border-radius:10px;outline:none;margin-bottom:8px;">';
    if(state.pwError) html+='<p style="font-size:12px;font-weight:500;color:#ff3b30;margin:0 0 12px;">Incorrect password. Please try again.</p>';
    html+='<div style="display:flex;gap:10px;margin-top:10px;"><button class="rh-blue" data-act="submitPw" style="flex:1 1 auto;font-family:inherit;font-size:14px;font-weight:600;border:none;cursor:pointer;border-radius:11px;padding:12px;background:#0071e3;color:#fff;">Unlock</button><button class="rh-grey" data-act="cancelPw" style="flex:none;font-family:inherit;font-size:14px;font-weight:600;border:none;cursor:pointer;border-radius:11px;padding:12px 18px;background:var(--grey-btn);color:var(--text-2);">Cancel</button></div></div></div>';
  }

  /* delete-subspecialty modal */
  if(state.deleteSubTarget && repo[state.deleteSubTarget]){
    var dt=state.deleteSubTarget, dd=repo[dt];
    var dCount=dd.rct.length+dd.review.length+dd.guideline.length;
    var ready=state.deleteSubInput.trim()===dt;
    html+='<div data-print-hide data-act="cancelDeleteSub" style="position:fixed;inset:0;z-index:210;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:rhPop .2s ease both;"><div data-act="stop" style="width:100%;max-width:420px;background:var(--surface);border-radius:20px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,0.3);animation:rhPop .3s ease both;"><div style="display:flex;align-items:center;gap:11px;margin-bottom:14px;"><div style="width:32px;height:32px;border-radius:9px;background:rgba(255,59,48,0.12);display:flex;align-items:center;justify-content:center;flex:none;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></div><h2 style="font-size:18px;font-weight:700;color:var(--text);margin:0;letter-spacing:-0.01em;">Delete '+esc(dt)+'?</h2></div><p style="font-size:14px;line-height:1.5;color:var(--text-2);margin:0 0 18px;">This permanently removes '+esc(dt)+' and all '+dCount+' records inside it. This cannot be undone.</p><label style="display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:7px;">Type <strong style="color:var(--text);">'+esc(dt)+'</strong> to confirm</label><input id="deleteSubInput" data-model="deleteSubInput" type="text" value="'+esc(state.deleteSubInput)+'" autocomplete="off" spellcheck="false" placeholder="Subspecialty name" class="rh-input-red" style="width:100%;height:42px;padding:0 14px;font-family:inherit;font-size:14px;color:var(--text);background:var(--fill);border:1px solid var(--border-3);border-radius:10px;outline:none;margin-bottom:18px;"><div style="display:flex;gap:10px;"><button data-act="confirmDeleteSub" style="flex:1 1 auto;font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:11px;padding:12px;color:#fff;background:'+(ready?'#ff3b30':'#f3b5b1')+';cursor:'+(ready?'pointer':'not-allowed')+';">Delete forever</button><button class="rh-grey" data-act="cancelDeleteSub" style="flex:none;font-family:inherit;font-size:14px;font-weight:600;border:none;cursor:pointer;border-radius:11px;padding:12px 18px;background:var(--grey-btn);color:var(--text-2);">Cancel</button></div></div></div>';
  }

  html+='</div>';

  app.innerHTML=html;
  if(animOn){ lastAnimKey=ak; requestAnimationFrame(runStagger); }
}

/* ---------- stagger (transform-only, matches spec) ---------- */
function runStagger(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var els=app.querySelectorAll('.rh-anim');
  els.forEach(function(c, i){
    try{ c.animate([{transform:'translateY(16px) scale(0.985)'},{transform:'none'}], {duration:460, delay:Math.min(i*38,520), easing:'cubic-bezier(0.22,1,0.36,1)', fill:'backwards'}); }catch(e){}
  });
}

/* ---------- setState with focus preservation ---------- */
function setState(patch){
  var a=document.activeElement;
  var f=(a&&a.id&&a.tagName==='INPUT')?{id:a.id,s:a.selectionStart,e:a.selectionEnd}:null;
  Object.assign(state, patch);
  render();
  if(f){ var el=document.getElementById(f.id); if(el){ el.focus(); try{ el.setSelectionRange(f.s,f.e); }catch(_){} } }
  else if(state.askPassword){ var p=document.getElementById('pwInput'); if(p) p.focus(); }
  else if(state.deleteSubTarget){ var ds=document.getElementById('deleteSubInput'); if(ds) ds.focus(); }
  writeHash();
}

/* ---------- event delegation ---------- */
var actions={
  resetDash:function(){ setState({view:'browse', libMode:'browse', topicId:Object.keys(getData())[0], query:''}); },
  toggleTheme:function(){ var nt=state.theme==='dark'?'light':'dark'; try{ localStorage.setItem('respHubTheme',nt); }catch(e){} state.theme=nt; document.documentElement.setAttribute('data-theme',nt); render(); },
  goSaved:function(){ setState({view:'browse', libMode:'saved', query:''}); },
  toggleSave:function(el){ var k=el.getAttribute('data-key'); var on; if(SAVED[k]){ delete SAVED[k]; on=false; } else { SAVED[k]=true; on=true; } persistSaved(); flash(on?'Saved':'Removed from saved'); writeHash(); if(on){ try{ var sel='.rh-star[data-key="'+((window.CSS&&CSS.escape)?CSS.escape(k):k)+'"] svg'; var svg=document.querySelector(sel); if(svg) svg.animate([{transform:'scale(.5)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:300,easing:'cubic-bezier(0.22,1,0.36,1)'}); }catch(e){} } },
  copyLink:function(el){ copyText(el.getAttribute('data-url'), 'Link copied'); },
  copyViewLink:function(){ copyText(location.href, 'Page link copied'); },
  goLibrary:function(){ setState({view:'browse'}); },
  goAdmin:function(){ if(state.adminAuthed) setState({view:'admin'}); else setState({askPassword:true, pwInput:'', pwError:false}); },
  openHelp:function(){ setState({showHelp:true}); },
  closeHelp:function(){ try{ localStorage.setItem('respHubSeen_v1','1'); }catch(e){} setState({showHelp:false}); },
  toggleNav:function(){ setState({navOpen:!state.navOpen}); },
  selectTopic:function(el){ setState({topicId:el.getAttribute('data-name'), query:'', libMode:'browse'}); },
  clearSearch:function(){ setState({query:'', libMode:'browse'}); },
  selectAdminTopic:function(el){ selectAdminTopic(el.getAttribute('data-name')); },
  askDeleteSub:function(el){ setState({deleteSubTarget:el.getAttribute('data-name'), deleteSubInput:''}); },
  addSub:function(){ addSub(); render(); },
  rename:function(){ renameSub(); render(); },
  typeOpt:function(el){ setState({afType:el.getAttribute('data-type')}); },
  saveArticle:function(){ saveArticle(); render(); },
  cancelEdit:function(){ setState({editing:null, afTitle:'', afUrl:''}); },
  editArticle:function(el){ editArticle(el.getAttribute('data-type'), +el.getAttribute('data-index')); },
  askDeleteArticle:function(el){ setState({confirmArticle:{type:el.getAttribute('data-type'), index:+el.getAttribute('data-index')}}); },
  confirmDeleteArticle:function(el){ deleteArticle(el.getAttribute('data-type'), +el.getAttribute('data-index')); render(); },
  cancelDeleteArticle:function(){ setState({confirmArticle:null}); },
  confirmDeleteSub:function(){ if(state.deleteSubTarget && state.deleteSubInput.trim()===state.deleteSubTarget){ var n=state.deleteSubTarget; deleteSub(n); setState({deleteSubTarget:null, deleteSubInput:''}); } },
  cancelDeleteSub:function(){ setState({deleteSubTarget:null, deleteSubInput:''}); },
  submitPw:function(){ submitPassword(); },
  cancelPw:function(){ setState({askPassword:false, pwInput:'', pwError:false}); },
  stop:function(){}
};
app.addEventListener('click', function(e){
  var t=e.target.closest('[data-act]');
  if(!t) return;
  var act=t.getAttribute('data-act');
  if(actions[act]){ actions[act](t); }
});
app.addEventListener('input', function(e){
  var t=e.target;
  var model=t.getAttribute&&t.getAttribute('data-model');
  if(!model) return;
  var patch={}; patch[model]=t.value;
  if(model==='pwInput') patch.pwError=false;
  setState(patch);
});
app.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  var t=e.target;
  var en=t.getAttribute&&t.getAttribute('data-enter');
  if(en==='addSub'){ addSub(); render(); }
  else if(en==='submitPw'){ submitPassword(); }
});
window.addEventListener('keydown', function(e){
  if((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K')){
    e.preventDefault();
    if(state.view!=='browse' || state.query || state.libMode!=='browse') setState({view:'browse', libMode:'browse'}); else render();
    requestAnimationFrame(function(){ var el=document.getElementById('globalSearch'); if(el) el.focus(); });
  }
});
/* shareable deep links: restore state from the URL on load + on back/forward */
window.addEventListener('hashchange', function(){ var h=readHash(); Object.assign(state, {topicId:h.topicId||null, query:h.query||'', libMode:h.libMode||'browse'}); render(); });

Object.assign(state, readHash());
render();
})();
</script>
